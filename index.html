<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Print Multi-Photo Layout Generator - PinoyProto 3D</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- CONTROL PANEL -->
    <div class="control-panel">
      <h2>Image Layout Generator</h2>
      <p class="subtitle">Upload 2 or 3 photos of your 3D model and choose an auto-layout template.</p>
      
      <!-- PHOTO UPLOADERS -->
      <div class="upload-group">
        <label>Photo 1 (Main/Hero Image)</label>
        <input type="file" id="img-input-1" accept="image/*" />

        <label>Photo 2</label>
        <input type="file" id="img-input-2" accept="image/*" />

        <label>Photo 3 (Optional)</label>
        <input type="file" id="img-input-3" accept="image/*" />
      </div>

      <!-- TEMPLATE LAYOUT SELECTOR -->
      <div class="layout-selection">
        <label>Select Layout Style</label>
        <div class="layout-grid">
          <button class="preset-btn active" data-layout="hero-split">Hero Split (1 Top, 2 Bottom)</button>
          <button class="preset-btn" data-layout="vertical-stack">Vertical Stack (3 Equal Rows)</button>
          <button class="preset-btn" data-layout="grid-2col">2-Photo Side-by-Side</button>
          <button class="preset-btn" data-layout="spotlight">Spotlight (Main + Floating Inset)</button>
        </div>
      </div>

      <!-- DESIGN CONTROLS -->
      <div class="style-controls">
        <div class="control-row">
          <label>Border / Gap Width</label>
          <input type="range" id="gap-slider" min="0" max="20" value="8" />
        </div>
        <div class="control-row">
          <label>Accent Line Color</label>
          <input type="color" id="accent-color" value="#ff5e00" />
        </div>
        <div class="control-row checkbox-row">
          <input type="checkbox" id="toggle-watermark" checked />
          <label for="toggle-watermark">Show PinoyProto 3D Watermark Badge</label>
        </div>
      </div>

      <button id="download-btn">Download Designed Image (3:4 PNG)</button>
    </div>

    <!-- PREVIEW CANVAS (3:4 PORTRAIT) -->
    <div class="preview-wrapper">
      <div id="layout-canvas" class="layout-canvas hero-split">
        <!-- Photo Containers -->
        <div class="photo-box box-1">
          <img id="prev-img-1" src="https://via.placeholder.com/600x800/1b1e29/fff?text=Upload+Photo+1" alt="Main Photo" />
        </div>

        <div class="photo-box box-2">
          <img id="prev-img-2" src="https://via.placeholder.com/600x800/222634/fff?text=Upload+Photo+2" alt="Photo 2" />
        </div>

        <div class="photo-box box-3">
          <img id="prev-img-3" src="https://via.placeholder.com/600x800/292d3e/fff?text=Upload+Photo+3" alt="Photo 3" />
        </div>

        <!-- Optional Watermark Badge -->
        <div id="watermark-badge" class="watermark-badge">PINOYPROTO 3D</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
