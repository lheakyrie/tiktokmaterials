<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinoyProto 3D Carousel & Studio Suite</title>

  <!-- Google Fonts: Anton, Bebas Neue, Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  
  <header class="workspace-header">
    <div class="brand">PINOYPROTO 3D <span>STUDIO</span></div>
  </header>

  <main class="tool-section">
    <div class="app-container">
      
      <!-- CONTROL PANEL -->
      <div class="control-panel">
        <h2>Carousel & Layout Builder (3:4)</h2>
        
        <!-- Slide Switch Tabs -->
        <div class="tab-group">
          <button id="tab-hook" class="tab-btn active">Slide 1 (Hook)</button>
          <button id="tab-product" class="tab-btn">Product Slide</button>
        </div>

        <!-- SLIDE 1 (HOOK) INPUTS -->
        <div id="section-hook" class="input-section">
          <label>Main Question / Hook</label>
          <textarea id="input-hook-title" rows="2">NEED A 3D DESIGN FOR YOUR PROJECT?</textarea>

          <label>Subtext / Lead-in</label>
          <input type="text" id="input-hook-sub" value="Swipe to see our recent 3D prints & custom models ➡️" />

          <label>Background Image</label>
          <input type="file" id="input-hook-bg" accept="image/*" />
        </div>

        <!-- PRODUCT SLIDE INPUTS (INTEGRATED STUDIO) -->
        <div id="section-product" class="input-section hidden">
          <label>Product / Project Name</label>
          <input type="text" id="input-prod-title" value="CUSTOM MECHANICAL BRACKET" />

          <label>Description / Specs</label>
          <textarea id="input-prod-desc" rows="3">PETG Material | High Stress Resistance | 0.2mm Layer Height</textarea>

          <label>Call to Action / Badge</label>
          <input type="text" id="input-prod-cta" value="AVAILABLE AT PINOYPROTO 3D" />

          <!-- INTEGRATED IMAGE DESIGNER CONTROLS -->
          <div class="image-controls-section">
            <div class="section-title">Design Highlight Layouts</div>

            <div class="upload-group">
              <label>Photo 1 (Sketch / Reference)</label>
              <input type="file" id="img-input-1" accept="image/*" />

              <label>Photo 2 (3D Model / Final Print)</label>
              <input type="file" id="img-input-2" accept="image/*" />

              <label>Photo 3 (Finished 3D Print / Main Showcase)</label>
              <input type="file" id="img-input-3" accept="image/*" />
