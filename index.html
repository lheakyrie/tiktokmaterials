<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinoyProto 3D Carousel & Studio Suite</title>

  <!-- Google Fonts: Anton, Bebas Neue, Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  
  <header class="workspace-header">
    <div class="brand">PINOYPROTO 3D <span>STUDIO</span></div>
  </header>

  <main class="tool-section">
    <div class="app-container">
      
      <!-- CONTROL PANEL -->
      <div class="control-panel">
        <h2>Carousel & Layout Builder (3:4)</h2>
        
        <!-- Slide Switch Tabs -->
        <div class="tab-group">
          <button id="tab-hook" class="tab-btn active">Slide 1 (Hook)</button>
          <button id="tab-product" class="tab-btn">Product Slide</button>
        </div>

        <div class="scrollable-controls">
          <!-- SLIDE 1 (HOOK) INPUTS -->
          <div id="section-hook" class="input-section">
            <label>Main Question / Hook</label>
            <textarea id="input-hook-title" rows="2">NEED A 3D DESIGN FOR YOUR PROJECT?</textarea>

            <label>Subtext / Lead-in</label>
            <input type="text" id="input-hook-sub" value="Swipe to see our recent 3D prints & custom models ➡️" />

            <label>Background Image</label>
            <input type="file" id="input-hook-bg" accept="image/*" />
          </div>

          <!-- PRODUCT SLIDE INPUTS -->
          <div id="section-product" class="input-section hidden">
            <label>Product / Project Name</label>
            <input type="text" id="input-prod-title" value="CUSTOM MECHANICAL BRACKET" />

            <label>Description / Specs</label>
            <textarea id="input-prod-desc" rows="2">PETG Material | High Stress Resistance | 0.2mm Layer Height</textarea>

            <label>Call to Action / Badge</label>
            <input type="text" id="input-prod-cta" value="AVAILABLE AT PINOYPROTO 3D" />

            <!-- INTEGRATED IMAGE DESIGNER CONTROLS -->
            <div class="image-controls-section">
              <div class="section-title">Design Highlight Layouts</div>

              <!-- PHOTO UPLOAD & CUSTOM LABEL CONTROLS -->
              <div class="upload-group">
                <label>Photo 1 (Top Left)</label>
                <input type="file" id="img-input-1" accept="image/*" />
                <select id="label-select-1" class="label-dropdown">
                  <option value="BEFORE: CLIENT SKETCH">Badge: BEFORE: CLIENT SKETCH</option>
                  <option value="REFERENCE">Badge: REFERENCE</option>
                  <option value="SKETCH">Badge: SKETCH</option>
                  <option value="OUR 3D MODEL">Badge: OUR 3D MODEL</option>
                </select>

                <label>Photo 2 (Top Right)</label>
                <input type="file" id="img-input-2" accept="image/*" />
                <select id="label-select-2" class="label-dropdown">
                  <option value="AFTER: 3D MODEL">Badge: AFTER: 3D MODEL</option>
                  <option value="OUR 3D MODEL">Badge: OUR 3D MODEL</option>
                  <option value="EXPLODED CAD VIEW">Badge: EXPLODED CAD VIEW</option>
                  <option value="FINAL 3D PRINT">Badge: FINAL 3D PRINT</option>
                </select>

                <label>Photo 3 (Bottom Main Showcase)</label>
                <input type="file" id="img-input-3" accept="image/*" />
                <select id="label-select-3" class="label-dropdown">
                  <option value="AFTER: OUR 3D PRINTS">Badge: AFTER: OUR 3D PRINTS</option>
                  <option value="FINAL 3D PRINT">Badge: FINAL 3D PRINT</option>
                  <option value="OUR 3D MODEL">Badge: OUR 3D MODEL</option>
                </select>

                <label>Photo 4 (Bottom Right - Inset Top)</label>
                <input type="file" id="img-input-4" accept="image/*" />

                <label>Photo 5 (Bottom Right - Inset Bottom)</label>
                <input type="file" id="img-input-5" accept="image/*" />
              </div>

              <label>Highlight Layout Templates</label>
              <div class="layout-grid">
                <button class="preset-btn active" data-layout="layout-1-vertical">Layout 1A: Before & After Split (Vertical)</button>
                <button class="preset-btn" data-layout="layout-1-horizontal">Layout 1B: Before & After Stack (Horizontal)</button>
                <button class="preset-btn" data-layout="layout-2">Layout 2: Reference Multi-Panel Showcase</button>
                <button class="preset-btn" data-layout="layout-3">Layout 3: Reference vs Final Print</button>
              </div>

              <label
